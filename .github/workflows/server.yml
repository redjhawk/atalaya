name: Server

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: server

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the musl C toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build the static release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Verify the binary is statically linked
        run: |
          file target/x86_64-unknown-linux-musl/release/atalaya-server | tee /dev/stderr | grep -Eq 'static(ally|-pie) linked'
