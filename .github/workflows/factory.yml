name: Atalaya factory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required repository docs
        run: |
          test -f AGENTS.md
          test -f GLOSSARY.md
          test -f apps/locator/README.md
          test -f agent/README.md
          test -f server/README.md
      - name: Detect trailing whitespace
        run: |
          if grep -RInE '[[:blank:]]+$' --include='*.md' --include='*.yml' --include='*.yaml' .; then
            echo 'Trailing whitespace found' >&2
            exit 1
          fi

  server:
    needs: foundation
    if: ${{ hashFiles('server/Cargo.toml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd server && cargo fmt --check && cargo test --locked && cargo build --release --target x86_64-unknown-linux-musl

  locator:
    needs: foundation
    if: ${{ hashFiles('apps/locator/**/build.gradle*') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: cd apps/locator && ./gradlew test assembleDebug
